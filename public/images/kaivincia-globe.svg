<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
<title id="title">Kaivincia Corp animated globe</title>
<defs>
 <radialGradient id="globe" cx="32%" cy="25%" r="75%"><stop offset="0" stop-color="#454545"/><stop offset=".38" stop-color="#151515"/><stop offset=".78" stop-color="#030303"/><stop offset="1" stop-color="#000"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a0"/><stop offset=".38" stop-color="#d4b84a"/><stop offset="1" stop-color="#80620d"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#aeb3bd"/></linearGradient>
 <clipPath id="clip"><circle cx="256" cy="256" r="225"/></clipPath>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="256" cy="256" r="242" fill="#050505"/>
<g class="globe">
 <circle cx="256" cy="256" r="225" fill="url(#globe)" stroke="#b9a34c" stroke-width="4"/>
 <g clip-path="url(#clip)" fill="none" stroke="#b79d43" opacity=".24">
  <ellipse cx="256" cy="256" rx="92" ry="225"/><ellipse cx="256" cy="256" rx="165" ry="225"/>
  <path d="M32 185 Q256 245 480 185 M32 325 Q256 265 480 325"/>
 </g>
 <path d="M100 170 Q155 105 210 135 L230 175 190 205 160 260 125 245 90 205Z M280 290 L325 265 365 285 390 345 355 395 315 370 290 330Z" fill="#aab0b8" opacity=".23"/>
 <path d="M70 170 Q115 50 256 31 Q402 38 450 170" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7"/>
</g>
<g class="orbit" fill="none" stroke="url(#gold)" stroke-width="9" filter="url(#glow)">
 <ellipse cx="256" cy="256" rx="246" ry="72" transform="rotate(-28 256 256)"/>
</g>
<g class="wordmark">
 <text x="256" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="600" letter-spacing="-4" fill="url(#silver)">Kai<tspan fill="url(#gold)" font-weight="800">V</tspan>incia</text>
 <path d="M257 257 Q300 158 361 92 M340 100 L365 84 L360 116" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="383" y="321" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#b9bec7" font-style="italic">Corp</text>
</g>
<style>
.globe{transform-origin:256px 256px;animation:turn 9s linear infinite}
.orbit{transform-origin:256px 256px;animation:orbit 5s linear infinite}
@keyframes turn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.globe,.orbit{animation:none}}
</style></svg>